[package]
name = "local-doc-browser"
version = "0.2.1"
description = "Local Markdown and HTML document browser"
authors = ["Jian Wang"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "local_doc_browser"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
trash = "5"
open = "5"
mime_guess = "2"
percent-encoding = "2"
url = "2"
regex = "1"
html-escape = "0.2"
unicode-normalization = "0.1"
natord = "1"
encoding_rs = "0.8"
dunce = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
tiny_http = "0.12"
